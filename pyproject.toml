[project]
name = "rag-agent-ex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "docling-parse>=7.22.2",
    "docling-slim[standard]>=2.133.0",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
]

# 프로젝트를 편집 가능(editable) 모드로 설치해, 어느 폴더의 노트북에서든
# common/ 패키지와 common_config.py를 sys.path 설정 없이 import 할 수 있게 한다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["common", "common_config.py"]
